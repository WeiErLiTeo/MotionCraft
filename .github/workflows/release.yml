name: Build and Release Android APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to attach release assets to (e.g. 1.0.5 or v1.0.5)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew || true

      - name: Restore Keystore if needed
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Android APK
        run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Organize APK Files
        run: |
          mkdir -p build_output
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          find app/build/outputs/apk/ -name "*.apk" | while read -r apk_file; do
            base_name=$(basename "$apk_file")
            clean_name=$(echo "$base_name" | sed "s/^app-/MotionCraft-${TAG}-/")
            cp "$apk_file" "build_output/$clean_name"
          done
          echo "Organized APK files:"
          ls -lh build_output/

      - name: Determine Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

