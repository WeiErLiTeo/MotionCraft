name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.2.2)'
        required: false
        default: ''
      release_title:
        description: 'Release title'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Restore Keystore if needed
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_artifacts
          
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v1.2.2"
          fi
          
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$RELEASE_APK" ]; then
            TARGET_APK="release_artifacts/MotionCraft-${TAG}-release.apk"
            cp "$RELEASE_APK" "$TARGET_APK"
            cd release_artifacts
            sha256sum $(basename "$TARGET_APK") > checksums-sha256.txt
            cd ..
            echo "Artifacts prepared:"
            ls -lh release_artifacts/
          else
            echo "Error: No APK found!"
            exit 1
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*.apk
            release_artifacts/*.txt
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_artifacts.outputs.tag }}
          body: |
            ### MotionCraft Android Release

            #### What's New & Highlights
            - 📸 **Live Photo Gallery**: Automatically scan and view all motion photos stored on your device with smooth grid loading.
            - 🎬 **Press to Play**: Long-press any photo card to instantly play the motion clip with gesture controls and full-screen playback.
            - 🔄 **Video to Motion Photo**: Easily convert regular video clips into motion photos (JPEG + MP4) with customizable cover frames.
            - 🔗 **Pair Photos & Videos**: Select any standalone picture and short video to combine them into standard Live Photo format.
            - 📦 **Extract Video & Frames**: Export embedded MP4 video or pick individual high-resolution photo frames.
            - 🔍 **XMP Metadata Inspector**: View detailed technical metadata like `MicroVideoOffset` and Google Motion Photo flags.
            - 🎨 **Theme & Appearance**: Full Material You dynamic color theming with light and dark mode support.
            - ⚡ **64-bit Architecture**: Optimized 64-bit build (`arm64-v8a` / `x86_64`) with minimal APK size.

            #### Verification
            Download the release APK and verify with the included `checksums-sha256.txt` SHA-256 hash.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
