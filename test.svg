<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#673AB7" />
      <stop offset="100%" stop-color="#009688" />
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F51B5" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Outer motion circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-dasharray="24 16" opacity="0.9"/>
  <!-- Camera Body Outer -->
  <circle cx="256" cy="256" r="110" fill="#FFFFFF" opacity="0.2"/>
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <!-- Center Lens -->
  <circle cx="256" cy="256" r="60" fill="url(#lens)"/>
  <circle cx="236" cy="236" r="20" fill="#FFFFFF" opacity="0.6"/>
  <!-- LIVE Badge Dot -->
  <circle cx="370" cy="142" r="28" fill="#FF5252"/>
  <circle cx="370" cy="142" r="18" fill="#FFFFFF"/>
</svg>
