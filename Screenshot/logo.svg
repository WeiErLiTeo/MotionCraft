<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="50%" stop-color="#651FFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Lens Outer Gradient -->
    <linearGradient id="lensOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0E0E0" stop-opacity="0.6" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979FF" />
      <stop offset="50%" stop-color="#3D5AFE" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Decorative Outer Wave Rings (Live Photo Motion Indicator) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="28 20" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="36 24" opacity="0.7" />

  <!-- Camera Body Center Base -->
  <circle cx="256" cy="256" r="116" fill="url(#lensOuter)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="102" fill="#121212" />

  <!-- Glass Lens Element -->
  <circle cx="256" cy="256" r="80" fill="url(#lensGlass)" />

  <!-- Lens Aperture / Aperture Ring Accent -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.8" />

  <!-- Lens Glass Light Reflection Highlights -->
  <path d="M 210 210 A 65 65 0 0 1 302 210 A 65 65 0 0 0 210 210 Z" fill="#FFFFFF" opacity="0.45" />
  <circle cx="226" cy="226" r="14" fill="#FFFFFF" opacity="0.7" />
  <circle cx="290" cy="286" r="8" fill="#00E5FF" opacity="0.8" />

  <!-- LIVE Recording Badge Accent (Top Right) -->
  <g filter="url(#shadow)">
    <circle cx="376" cy="136" r="28" fill="#FF1744" />
    <circle cx="376" cy="136" r="16" fill="#FFFFFF" />
    <circle cx="376" cy="136" r="10" fill="#FF1744" />
  </g>
</svg>
